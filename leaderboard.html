<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - MathChain Miner</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>MathChain</span>
            </a>
            <div class="nav-links">
                <a href="game.html">Mine</a>
                <a href="leaderboard.html" class="active">Leaderboard</a>
                <a href="blocks.html">Blocks</a>
                <button class="btn btn-secondary btn-small" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <header class="page-header">
            <h1 class="page-title">🏆 Global Leaderboard</h1>
            <p class="page-subtitle">Top miners from around the world</p>
        </header>

        <!-- Filters -->
        <div class="card filters-card">
            <div class="filters-row">
                <div class="filter-group">
                    <label>Grade Filter</label>
                    <select id="gradeFilter" class="filter-select">
                        <option value="all">All Grades</option>
                        <option value="5">Grade 5</option>
                        <option value="6">Grade 6</option>
                        <option value="7">Grade 7</option>
                        <option value="8">Grade 8</option>
                        <option value="9">Grade 9</option>
                        <option value="10">Grade 10</option>
                        <option value="11">Grade 11</option>
                        <option value="12">Grade 12</option>
                        <option value="13">Grade 13</option>
                        <option value="14">Grade 14</option>
                        <option value="15">Grade 15</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Show</label>
                    <select id="limitFilter" class="filter-select">
                        <option value="10">Top 10</option>
                        <option value="25">Top 25</option>
                        <option value="50">Top 50</option>
                        <option value="100">Top 100</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="refreshBtn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="card leaderboard-card">
            <div class="leaderboard-table-container" id="leaderboardContainer">
                <div class="loading">Loading leaderboard...</div>
            </div>
        </div>
    </div>

    <footer class="landing-footer" style="margin-top: 3rem; padding: 2rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.1);">
        <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem;">&copy; 2026 MathChain Miner • Created by <a href="https://github.com/ivocreates" target="_blank" style="color: var(--primary); text-decoration: none;">IvoCreates</a> • <a href="https://github.com/ivocreates/blockgame" target="_blank" style="color: var(--primary); text-decoration: none;">GitHub</a></p>
    </footer>

    <script type="module" src="auth.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="leaderboard-page.js"></script>
</body>
</html>
