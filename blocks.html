<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain History - MathChain Miner</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>MathChain</span>
            </a>
            <div class="nav-links">
                <a href="game.html">Mine</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a href="blocks.html" class="active">Blocks</a>
                <button class="btn btn-secondary btn-small" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <header class="page-header">
            <h1 class="page-title">🔗 Blockchain History</h1>
            <p class="page-subtitle">All blocks mined by the community</p>
            <div class="stats-bar">
                <div class="stat-badge">
                    <span class="stat-label">Total Blocks</span>
                    <span class="stat-number" id="totalBlocks">0</span>
                </div>
                <div class="stat-badge">
                    <span class="stat-label">Total Miners</span>
                    <span class="stat-number" id="totalMiners">0</span>
                </div>
                <div class="stat-badge">
                    <span class="stat-label">Chain Valid</span>
                    <span class="stat-number" id="chainValid">✓</span>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="card filters-card">
            <div class="filters-row">
                <input type="text" id="searchMiner" class="search-input" placeholder="Search by miner name...">
                <button class="btn btn-primary" id="refreshBlocksBtn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Blocks List -->
        <div class="blocks-list" id="blocksContainer">
            <div class="loading">Loading blocks...</div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module" src="blockchain.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="blocks-page.js"></script>
</body>
</html>
